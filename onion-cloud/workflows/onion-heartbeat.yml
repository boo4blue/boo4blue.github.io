name: Onion Cloud heartbeat

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write status
        run: |
          mkdir -p onion-cloud/site/data
          python3 - <<'EOF'
          import json, datetime
          st = {
              "alive": True,
              "at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "run": "${{ github.run_number }}",
              "sha": "${{ github.sha }}"[:7],
          }
          open("onion-cloud/site/data/status.json", "w").write(json.dumps(st, indent=2))
          print("heartbeat", st["run"])
          EOF

      - name: Commit status
        run: |
          git config user.name "onion-cloud"
          git config user.email "onion-cloud@boo4blue.github.io"
          git add onion-cloud/site/data/status.json
          git diff --cached --quiet || (git commit -m "onion-cloud heartbeat" && git push)

<!DOCTYPE html>
<!-- teamhq-build-20261022-1904 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1220">
<title>Team HQ</title>
<style>
:root{
  --bg:#0d1220; --bg2:#111827; --surface:#1a2236; --surface2:#232c44;
  --text:#eef1f8; --text2:#a9b2cc; --line:rgba(255,255,255,.06);
  --neon-web:#7c8aff; --neon-build:#4ade80;
  --ok:#4ade80; --warn:#fbbf24; --danger:#f87171; --idle:#6b7280;
  --r:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px; line-height:1.45; min-height:100vh;
  background-image:
    radial-gradient(1200px 600px at 50% -10%, rgba(124,138,255,.08), transparent 60%),
    linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
  background-size:auto,44px 44px,44px 44px;
  padding-bottom:76px;
}
#app{max-width:560px;margin:0 auto;}
/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(13,18,32,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;}
.brand{display:flex;align-items:center;gap:9px;min-width:0;}
.brand img{width:30px;height:30px;border-radius:8px;flex:none;}
.brand .wm{font-weight:800;letter-spacing:3px;font-size:15px;white-space:nowrap;}
.brand .wm .hq{color:var(--neon-web);}
.hspace{flex:1;}
.conn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);min-height:44px;}
.dot{width:10px;height:10px;border-radius:50%;flex:none;}
.dot.live{background:var(--ok);box-shadow:0 0 8px var(--ok);}
.dot.stale{background:var(--warn);box-shadow:0 0 8px var(--warn);}
.dot.off{background:#4b5563;}
.stale-badge{display:none;background:rgba(251,191,36,.14);color:var(--warn);border:1px solid rgba(251,191,36,.4);
  border-radius:999px;font-size:11px;font-weight:700;padding:4px 10px;letter-spacing:1px;}
.stale-badge.on{display:inline-block;}
.msgall{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:10px;
  min-height:44px;padding:0 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.msgall:active{background:#2c3654;}
/* ---------- views ---------- */
.view{display:none;padding:14px 14px 8px;}
.view.on{display:block;}
/* banner */
.banner{background:rgba(124,138,255,.1);border:1px solid rgba(124,138,255,.35);border-radius:12px;
  padding:12px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;font-size:13px;}
.banner.hide{display:none;}
.banner button{background:none;border:none;color:var(--text2);font-size:18px;min-width:44px;min-height:44px;cursor:pointer;}
/* team sections */
.team-sec{margin-bottom:18px;}
.team-head{display:flex;align-items:center;gap:8px;margin:4px 2px 10px;}
.team-head .tdot{width:10px;height:10px;border-radius:50%;flex:none;}
.team-head h2{font-size:15px;margin:0;font-weight:700;letter-spacing:.5px;}
.team-head .counts{margin-left:auto;font-size:12px;color:var(--text2);}
/* member card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-bottom:10px;position:relative;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);}
.card.dim{opacity:.62;}
.card .row1{display:flex;align-items:center;gap:10px;}
.pfp{width:48px;height:48px;border-radius:50%;flex:none;object-fit:cover;border:2px solid var(--ring,#7c8aff);
  box-shadow:0 0 10px -2px var(--ring,#7c8aff);}
.pfp-init{width:48px;height:48px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:20px;color:var(--text);border:2px solid var(--ring,#7c8aff);
  box-shadow:0 0 10px -2px var(--ring,#7c8aff);background:var(--surface2);}
.who{min-width:0;flex:1;}
.who .nm{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.role-chip{font-size:11px;font-weight:700;color:var(--text2);background:var(--surface2);
  border:1px solid var(--line);border-radius:999px;padding:2px 9px;}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:5px 11px;display:inline-flex;
  align-items:center;gap:6px;white-space:nowrap;}
.pill .pdot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;}
.pill.working{color:var(--ok);background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.35);}
.pill.working .pdot{box-shadow:0 0 8px var(--ok);animation:pulse 1.6s infinite;}
.pill.idle{color:#9ca3af;background:rgba(107,114,128,.1);border:1px solid rgba(107,114,128,.35);}
.pill.waiting{color:var(--warn);background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35);}
.pill.paused{color:var(--danger);background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.35);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.kebab{background:none;border:none;color:var(--text2);font-size:20px;min-width:44px;min-height:44px;
  border-radius:10px;cursor:pointer;letter-spacing:2px;}
.kebab:active{background:var(--surface2);}
.menu{position:absolute;top:56px;right:10px;z-index:30;background:var(--surface2);
  border:1px solid var(--line);border-radius:12px;min-width:220px;box-shadow:0 12px 32px rgba(0,0,0,.5);
  display:none;overflow:hidden;}
.menu.on{display:block;}
.menu button{display:flex;width:100%;background:none;border:none;color:var(--text);font-size:14px;
  padding:0 16px;min-height:48px;align-items:center;cursor:pointer;text-align:left;}
.menu button:active{background:#2c3654;}
.menu button+button{border-top:1px solid var(--line);}
.taskline{font-size:14px;margin:10px 0 8px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.taskline.empty{color:var(--text2);font-style:italic;}
.bar-row{display:flex;align-items:center;gap:10px;}
.bar{flex:1;height:8px;border-radius:4px;background:#141a2c;overflow:hidden;}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--fill),var(--fill2));
  box-shadow:0 0 12px var(--fill);}
.pct{font-size:13px;font-weight:800;min-width:42px;text-align:right;}
.barlabel{font-size:12px;color:var(--text2);margin-top:6px;display:flex;justify-content:space-between;gap:8px;}
.barlabel .upd{white-space:nowrap;flex:none;}
/* ---------- chat ---------- */
.thread-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 14px;margin-bottom:10px;min-height:72px;cursor:pointer;width:100%;
  color:var(--text);font:inherit;text-align:left;}
.thread-row:active{background:var(--surface2);}
.stack{display:flex;flex:none;width:48px;height:48px;align-items:center;}
.stack img,.stack .mini{width:30px;height:30px;border-radius:50%;border:2px solid var(--bg);object-fit:cover;
  margin-left:-10px;background:var(--surface2);}
.stack img:first-child,.stack .mini:first-child{margin-left:0;}
.tinfo{flex:1;min-width:0;}
.tinfo .tn{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;}
.tinfo .tp{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.unread{background:var(--neon-web);color:#0d1220;font-size:12px;font-weight:800;border-radius:999px;
  min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;padding:0 7px;flex:none;}
.clear-row{margin:14px 2px 0;}
.clear-row button{background:none;border:1px solid var(--line);color:var(--text2);border-radius:10px;
  font-size:12px;min-height:44px;padding:0 16px;cursor:pointer;}
/* thread */
.thead{position:sticky;top:57px;z-index:35;background:rgba(13,18,32,.94);backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);margin:-14px -14px 0;padding:8px 14px;}
.backbtn{background:none;border:none;color:var(--text);font-size:22px;min-width:44px;min-height:44px;cursor:pointer;}
#msgs{padding:14px 0 8px;display:flex;flex-direction:column;gap:8px;min-height:200px;}
.msg{max-width:82%;padding:10px 13px;border-radius:14px;font-size:14px;word-wrap:break-word;}
.msg.out{align-self:flex-end;background:linear-gradient(135deg,#5b6cff,#7c8aff);color:#fff;border-bottom-right-radius:4px;}
.msg.in{align-self:flex-start;background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:4px;}
.msg .who{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:3px;}
.msg .mts{font-size:10px;color:rgba(255,255,255,.55);margin-top:4px;}
.msg.in .mts{color:var(--text2);}
.msg.queued{opacity:.6;}
.conn-note{font-size:12px;color:var(--warn);text-align:center;padding:6px;display:none;}
.conn-note.on{display:block;}
.composer{position:sticky;bottom:76px;display:flex;gap:8px;align-items:flex-end;padding:8px 0 4px;
  background:linear-gradient(transparent,var(--bg) 30%);}
.composer textarea{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  color:var(--text);font:inherit;font-size:14px;padding:12px;resize:none;max-height:96px;min-height:48px;}
.sendbtn{background:linear-gradient(135deg,#5b6cff,#7c8aff);color:#fff;border:none;border-radius:12px;
  min-width:64px;min-height:48px;font-size:15px;font-weight:800;cursor:pointer;}
.sendbtn:active{opacity:.85;}
/* ---------- tools ---------- */
.tool-group{margin-bottom:16px;}
.tool-row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;}
.tool-row .tr-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.tool-row .tr-head .pfp{width:40px;height:40px;font-size:16px;}
.tool-row .nm{font-weight:700;font-size:15px;flex:1;}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.tool-grid button{background:var(--surface2);border:1px solid var(--line);color:var(--text);
  border-radius:10px;min-height:48px;font-size:13px;font-weight:700;cursor:pointer;padding:0 8px;}
.tool-grid button:active{background:#2c3654;}
.tool-grid button.danger{color:var(--danger);}
/* ---------- tab bar ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(17,24,39,.97);
  border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text2);
  text-decoration:none;font-size:11px;font-weight:700;min-height:56px;justify-content:center;border-radius:10px;}
nav.tabs a.on{color:var(--text);}
nav.tabs a.on svg{stroke:var(--neon-web);filter:drop-shadow(0 0 6px rgba(124,138,255,.8));}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.tab-badge{position:absolute;margin:-18px 0 0 26px;}
/* toast */
#toasts{position:fixed;left:0;right:0;bottom:84px;z-index:60;display:flex;flex-direction:column;
  align-items:center;gap:8px;pointer-events:none;padding:0 16px;}
.toast{background:#0f172a;border:1px solid rgba(124,138,255,.5);color:var(--text);border-radius:12px;
  padding:12px 18px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.5);
  animation:tin .2s ease-out;max-width:100%;}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
@media (min-width:600px){ body{padding-bottom:90px;} }
</style>
</head>

var state = { status: SEED, mqtt:false, view:"teams", thread:null, overrides:{} };

refreshTeams();
function members(){ return state.status.members||[]; }
function member(id){ var ms=members(); for(var i=0;i<ms.length;i++) if(ms[i].id===id) return ms[i]; return null; }
function effStatus(m){ var o=state.overrides[m.id]; if(o && Date.parse(m.last_update||0) <= o.ts) return o.status; return m.status; }
function teamColor(m){ var t=teamsById[m.team]; return t&&t.color?t.color:"#7c8aff"; }
/* ---------- time ---------- */
function timeAgo(ts){
  if(!ts) return "";
  var d = Date.now() - Date.parse(ts);
  if(isNaN(d)||d<0) d=0;
  var s=Math.floor(d/1000);
  if(s<30) return "just now";
  var m=Math.floor(s/60); if(m<60) return m+" min ago";
  var h=Math.floor(m/60); if(h<24) return h+(h===1?" h ago":" h ago");
  var dd=Math.floor(h/24); return dd+(dd===1?" day ago":" days ago");
}
function absTime(ts){ try{ return new Date(ts).toLocaleString(); }catch(e){ return ""; } }
function isStale(){ var u=state.status.updated_at; if(!u) return true; return (Date.now()-Date.parse(u))>STALE_MS; }
/* ---------- toast ---------- */
function toast(msg){
  var t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  $("#toasts").appendChild(t);
  setTimeout(function(){ t.style.opacity="0"; t.style.transition="opacity .3s"; setTimeout(function(){ t.remove(); },320); }, 2600);
}
/* ---------- avatars ---------- */
function avatarImg(m, cls){
  cls = cls||"pfp";
  var init = '<span class="'+cls+' pfp-init" style="--ring:'+teamColor(m)+'">'+esc(m.name.charAt(0))+"</span>";
  if(AVATARS[m.id]){
    return '<img class="'+cls+'" src="'+AVATARS[m.id]+'" alt="'+esc(m.name)+'" style="--ring:'+teamColor(m)+'" data-mid="'+m.id+'" onerror="avatarErr(this)">';
  }
  if(m.avatar){
    return '<img class="'+cls+'" src="'+esc(m.avatar)+'" alt="'+esc(m.name)+'" style="--ring:'+teamColor(m)+'" data-mid="'+m.id+'" data-tried="1" onerror="avatarErr(this)">';
  }
  return init;
}
window.avatarErr = function(el){
  var m = member(el.getAttribute("data-mid"));
  var fallback = m ? '<span class="'+el.className.replace("pfp ","")+' pfp-init" style="--ring:'+teamColor(m)+'">'+esc(m.name.charAt(0))+"</span>" : "";
  if(el.getAttribute("data-tried")==="1" || !m || !m.avatar){
    el.outerHTML = fallback;
  } else {
    el.setAttribute("data-tried","1");
    el.src = m.avatar;
  }
};
/* ---------- pills ---------- */
var PILL_LABEL = { working:"Working", idle:"Idle", waiting:"Waiting", paused:"Paused" };
function pill(st){ return '<span class="pill '+st+'"><span class="pdot"></span>'+(PILL_LABEL[st]||st)+"</span>"; }
/* ---------- dashboard ---------- */
function memberCard(m){
  var st = effStatus(m);
  var task = m.current_task;
  var label = m.progress_label || "No task yet";
  var pct = Math.max(0, Math.min(100, m.progress_pct||0));
  var steps = m.progress_steps;
  var stepTxt = (steps && steps.total>0) ? (steps.done+"/"+steps.total+" steps \u2014 ") : "";
  var dim = (m.last_update && (Date.now()-Date.parse(m.last_update))>DIM_MS) ? " dim" : "";
  var menu = '<div class="menu" id="menu-'+m.id+'">'
    + '<button data-act="newtask" data-id="'+m.id+'">New task</button>'
    + '<button data-act="ping" data-id="'+m.id+'">Ping for status</button>'
    + '<button data-act="'+(st==="paused"?"resume":"pause")+'" data-id="'+m.id+'">'+(st==="paused"?"Resume":"Pause")+"</button>"
    + "</div>";
  var c = teamColor(m);
  return '<div class="card'+dim+'" data-open="'+m.id+'">'
    + '<div class="row1">'+avatarImg(m)
    + '<div class="who"><div class="nm">'+esc(m.name)+' <span class="role-chip">'+esc(m.role||"")+"</span></div></div>"
    + pill(st)
    + '<button class="kebab" data-kebab="'+m.id+'" aria-label="Manage '+esc(m.name)+'">&#8942;</button>'
    + "</div>"
    + '<div class="taskline'+(task?"":" empty")+'">'+esc(task||"Waiting for first task")+"</div>"
    + '<div class="bar-row"><div class="bar"><i style="width:'+pct+'%;--fill:'+c+';--fill2:'+c+'"></i></div>'
    + '<div class="pct">'+pct+"%</div></div>"
    + '<div class="barlabel"><span>'+esc(stepTxt+label)+'</span><span class="upd" data-ts="'+esc(m.last_update||"")+'" title="'+esc(absTime(m.last_update))+'">'+esc(m.last_update?("updated "+timeAgo(m.last_update)):"")+"</span></div>"
    + menu
    + "</div>";
}
function renderDashboard(){
  var html = "";
  var allIdle = true;
  (state.status.teams||[]).forEach(function(t){
    var tms = members().filter(function(m){ return m.team===t.id; });
    if(!tms.length) return;
    var counts = {};
    tms.forEach(function(m){ var s=effStatus(m); counts[s]=(counts[s]||0)+1; if(s!=="idle") allIdle=false; });
    var order=["working","waiting","paused","idle"];
    var cstr = order.filter(function(s){return counts[s];}).map(function(s){return counts[s]+" "+PILL_LABEL[s].toLowerCase();}).join(" \u00B7 ");
    html += '<div class="team-sec"><div class="team-head"><span class="tdot" style="background:'+t.color+';box-shadow:0 0 8px '+t.color+'"></span>'
      + "<h2>"+esc(t.name)+'</h2><span class="counts">'+esc(cstr)+"</span></div>";
    tms.forEach(function(m){ html += memberCard(m); });
    html += "</div>";
  });
  $("#teams").innerHTML = html;
  var banner = $("#firstBanner");
  if(allIdle && !LS.get("bannerDismissed", false)) banner.classList.remove("hide");
  else banner.classList.add("hide");
}
/* ---------- header ---------- */
function renderHeader(){
  var stale = isStale(), dot = $("#connDot"), txt = $("#connText");
  dot.className = "dot " + ((!state.mqtt && stale) ? "off" : (stale ? "stale" : (state.mqtt ? "live" : "stale")));
  txt.textContent = (!state.mqtt && stale) ? "Offline" : (stale ? "Stale" : (state.mqtt ? "Live" : "Stale"));
  $("#staleBadge").classList.toggle("on", stale);
}
/* ---------- chat ---------- */
function histKey(id){ return id==="broadcast" ? "broadcast" : "dm:"+id; }

function saveHist(id, h){ if(h.length>200) h=h.slice(h.length-200); LS.set(histKey(id), h); }
function threadName(id){ if(id==="broadcast") return "Everyone"; var m=member(id); return m?m.name:id; }
function lastMsgPreview(id){
  var h=getHist(id); if(!h.length) return "";
  var m=h[h.length-1];
  var who = m.dir==="out" ? "You: " : (m.from==="producer"||m.from==="boo" ? "" : "");
  if(id==="broadcast" && m.dir==="in" && m.from!=="producer"){ var mm=member(m.from); who = (mm?mm.name:m.from)+": "; }
  return who + m.text;
}
function renderChatList(){
  var html = "";
  var unread = LS.get("unread", {});
  var bPrev = lastMsgPreview("broadcast");
  var stack = members().slice(0,4).map(function(m){ return AVATARS[m.id] ? '<img src="'+AVATARS[m.id]+'" alt="">' : '<span class="mini"></span>'; }).join("");

    + '<span class="tinfo"><span class="tn">Everyone</span><span class="tp">'+esc(bPrev||"One message for the whole crew")+"</span></span>"
    + (unread.broadcast?'<span class="unread">'+unread.broadcast+"</span>":"") + "</button>";
  members().forEach(function(m){
    var u = unread[m.id]||0;
    var h = getHist(m.id); var lastTs = h.length?h[h.length-1].ts:null;
    html += '<button class="thread-row" data-thread="'+m.id+'">'+avatarImg(m)
      + '<span class="tinfo"><span class="tn">'+esc(m.name)+" "+pill(effStatus(m))+'</span><span class="tp">'+esc(lastMsgPreview(m.id)||"No messages yet")+"</span></span>"

  else b.style.display="none";

function openThread(id){

}
function renderThread(){

    var stack = members().slice(0,4).map(function(m){ return AVATARS[m.id] ? '<img src="'+AVATARS[m.id]+'" alt="" style="width:26px;height:26px;border-radius:50%;border:2px solid var(--bg);margin-left:-8px;object-fit:cover">' : ""; }).join("");

  } else {
    var m = member(id);
    head.innerHTML = avatarImg(m) + '<span style="min-width:0"><span style="font-weight:700;font-size:15px">'+esc(m?m.name:id)+'</span><br>'+pill(m?effStatus(m):"idle")+"</span>";
    $("#threadKebab").style.display = "";
    $("#threadKebab").setAttribute("data-kebab", id);
  }
  var h = getHist(id);
  var html = "";
  h.forEach(function(msg){
    var nm = "";
    if(msg.dir==="in"){
      if(id==="broadcast"){ nm = msg.from==="producer" ? "HQ" : (member(msg.from)?member(msg.from).name:msg.from); }
      else { nm = msg.from==="producer" ? "HQ" : threadName(id); }
    }
    html += '<div class="msg '+msg.dir+(msg.queued?" queued":"")+'">'
      + (nm?'<div class="who">'+esc(nm)+"</div>":"")
      + esc(msg.text).replace(/\n/g,"<br>")
      + '<div class="mts" data-ts="'+esc(msg.ts||"")+'" title="'+esc(absTime(msg.ts))+'">'+esc(msg.ts?timeAgo(msg.ts):"")+(msg.queued?" \u00B7 queued":"")+"</div></div>";
  });
  var box = $("#msgs"); box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
  window.scrollTo(0, document.body.scrollHeight);
  var note = $("#connNote");
  note.classList.toggle("on", !state.mqtt);
}
function sendCurrent(){
  var id = state.thread; if(!id) return;
  var ta = $("#composer");
  var text = ta.value.trim(); if(!text) return;
  var ts = new Date().toISOString();
  var topic = id==="broadcast" ? "team-hq/boo/all" : "team-hq/boo/dm/"+id;
  var payload = { text:text, ts:ts };
  var h = getHist(id);
  var queued = !state.mqtt;
  h.push({ from:"boo", dir:"out", text:text, ts:ts, queued:queued });
  saveHist(id, h);
  if(queued){
    var ob = LS.get("outbox", []);
    ob.push({ topic:topic, payload:payload, thread:id, ts:ts });
    LS.set("outbox", ob);
  } else {
    publish(topic, payload);
  }
  ta.value = ""; ta.style.height = "auto";
  renderThread(); renderChatList();
}
/* ---------- MQTT ---------- */
var client = null;
function publish(topic, payload){
  var s = JSON.stringify(payload);
  if(client && state.mqtt){ try{ client.publish(topic, s); }catch(e){ queueOut(topic, payload); } }
  else queueOut(topic, payload);
}
function queueOut(topic, payload){
  var ob = LS.get("outbox", []);
  ob.push({ topic:topic, payload:payload, thread:null, ts:new Date().toISOString() });
  LS.set("outbox", ob);
}
function flushOutbox(){
  var ob = LS.get("outbox", []);
  if(!ob.length || !client || !state.mqtt) return;
  LS.set("outbox", []);
  ob.forEach(function(item){ try{ client.publish(item.topic, JSON.stringify(item.payload)); }catch(e){} });
  ["broadcast"].concat(members().map(function(m){return m.id;})).forEach(function(tid){
    var h = getHist(tid), changed=false;
    h.forEach(function(m){ if(m.queued){ m.queued=false; changed=true; } });
    if(changed) saveHist(tid, h);
  });
  if(state.thread) renderThread();
}
function onMqttMsg(topic, buf){
  var p; try{ p = JSON.parse(buf.toString()); }catch(e){ return; }
  if(topic === "team-hq/onion/replies"){
    var from = p.from || "producer";
    var tid = (from==="producer"||from==="all") ? "broadcast" : (member(from)?from:"broadcast");
    var h = getHist(tid);
    h.push({ from:from, dir:"in", text:String(p.text||""), ts:p.ts||new Date().toISOString() });
    saveHist(tid, h);
    if(state.thread===tid){ renderThread(); }
    else { var u=LS.get("unread",{}); u[tid]=(u[tid]||0)+1; LS.set("unread",u); }
    renderChatList();
  } else if(topic === "team-hq/onion/status"){
    fetchStatus(true);
  }
}
var mqttTries = 0;
function mqttInit(){
  if(typeof window.mqtt === "undefined"){
    if(mqttTries < 10){ mqttTries++; setTimeout(mqttInit, 3000); }
    else { renderHeader(); }
    return;
  }
  mqttConnect();
}
function mqttConnect(){
  try{
    client = window.mqtt.connect(BROKER, { keepalive:30, connectTimeout:9000, reconnectPeriod:5000, clean:true });
    client.on("connect", function(){
      state.mqtt = true;
      try{ client.subscribe("team-hq/onion/replies"); client.subscribe("team-hq/onion/status"); }catch(e){}
      flushOutbox(); renderHeader(); renderThreadSafe();
    });
    var down = function(){ state.mqtt=false; renderHeader(); renderThreadSafe(); };
    client.on("close", down); client.on("offline", down); client.on("reconnect", down);
    client.on("error", function(){});
    client.on("message", onMqttMsg);
  }catch(e){ state.mqtt=false; }
}
function renderThreadSafe(){ if(state.thread && state.view==="chat") renderThread(); }
/* ---------- status polling ---------- */
function fetchStatus(force){
  var bust = (state.status && state.status.updated_at) ? encodeURIComponent(state.status.updated_at) : Date.now();
  fetch("status.json?t="+bust, { cache:"no-store" }).then(function(r){
    if(!r.ok) throw new Error("http "+r.status);
    return r.json();
  }).then(function(j){
    if(!j || !j.members) throw new Error("bad json");
    state.status = j; refreshTeams();
    LS.set("status", j);
    render();
  }).catch(function(){
    var cached = LS.get("status", null);
    if(cached && cached.members){ state.status = cached; refreshTeams(); }
    render();
  });
}
/* ---------- manage actions ---------- */
function doNewTask(id){
  openThread(id);
  var ta = $("#composer");
  ta.value = NEWTASK_TPL; ta.style.height = "auto";
  setTimeout(function(){ ta.focus(); ta.setSelectionRange(6,6); }, 60);
  toast("Brief ready \u2014 edit and send");
}
function doPing(id){
  var m = member(id);
  publish("team-hq/boo/cmd/"+id, { action:"ping", text:"", ts:new Date().toISOString() });
  toast("Pinged "+(m?m.name:"member")+" \u2713");
}
function doPauseResume(id){
  var m = member(id); if(!m) return;
  var cur = effStatus(m);
  var next = cur==="paused" ? "resume" : "pause";
  publish("team-hq/boo/cmd/"+id, { action:next, text:"", ts:new Date().toISOString() });
  state.overrides[id] = { status: next==="pause" ? "paused" : (m.status==="paused" ? "idle" : m.status), ts: Date.now() };
  render();
  toast((next==="pause" ? "Paused " : "Resumed ") + m.name);
}
function closeMenus(){ $$(".menu.on").forEach(function(x){ x.classList.remove("on"); }); }
/* ---------- tools tab ---------- */
function renderTools(){
  var html = "";
  (state.status.teams||[]).forEach(function(t){
    var tms = members().filter(function(m){ return m.team===t.id; });
    if(!tms.length) return;
    html += '<div class="tool-group"><div class="team-head"><span class="tdot" style="background:'+t.color+';box-shadow:0 0 8px '+t.color+'"></span><h2>'+esc(t.name)+"</h2></div>";
    tms.forEach(function(m){
      var st = effStatus(m);
      html += '<div class="tool-row"><div class="tr-head">'+avatarImg(m)
        + '<span class="nm">'+esc(m.name)+'</span>'+pill(st)+"</div>"
        + '<div class="tool-grid">'
        + '<button data-act="newtask" data-id="'+m.id+'">New task</button>'
        + '<button data-act="ping" data-id="'+m.id+'">Ping for status</button>'
        + (st==="paused"
            ? '<button data-act="resume" data-id="'+m.id+'">Resume</button>'
            : '<button data-act="pause" data-id="'+m.id+'" class="danger">Pause</button>')
        + '<button data-act="dm" data-id="'+m.id+'">Open chat</button>'
        + "</div></div>";
    });
    html += "</div>";
  });
  $("#tools").innerHTML = html;
}
/* ---------- views / nav ---------- */
var VIEWS = ["teams","chat","tools"];
function showView(v){
  state.view = v;
  VIEWS.forEach(function(x){ $("#view-"+x).classList.remove("on"); $("#tab-"+x).classList.remove("on"); });
  if(v==="chat" && state.thread){ $("#view-thread").classList.add("on"); }
  else { $("#view-"+v).classList.add("on"); }
  $("#tab-chat").classList.toggle("on", v==="chat");
  $("#tab-"+v).classList.add("on");
  if(("#"+v) !== location.hash){ try{ history.replaceState(null,"","#"+v); }catch(e){ location.hash=v; } }
  window.scrollTo(0,0);
  if(v==="teams") renderDashboard();
  if(v==="chat"){ renderChatList(); if(state.thread) renderThread(); }
  if(v==="tools") renderTools();
}
function render(){ renderHeader(); if(state.view==="teams") renderDashboard(); if(state.view==="chat"){ renderChatList(); if(state.thread) renderThread(); } if(state.view==="tools") renderTools(); }
/* ---------- events ---------- */
document.addEventListener("click", function(e){
  var t = e.target;
  var kebab = t.closest("[data-kebab]");
  if(kebab){
    e.stopPropagation();
    var id = kebab.getAttribute("data-kebab");
    var menu = $("#menu-"+id) || $("#threadMenu");
    var was = menu.classList.contains("on");
    closeMenus();
    if(!was){
      if(menu.id==="threadMenu"){
        var m = member(id), st = m?effStatus(m):"idle";
        menu.innerHTML = '<button data-act="newtask" data-id="'+id+'">New task</button>'
          + '<button data-act="ping" data-id="'+id+'">Ping for status</button>'
          + '<button data-act="'+(st==="paused"?"resume":"pause")+'" data-id="'+id+'">'+(st==="paused"?"Resume":"Pause")+"</button>";
      }
      menu.classList.add("on");
    }
    return;
  }
  var act = t.closest("[data-act]");
  if(act){
    closeMenus();
    var a = act.getAttribute("data-act"), id2 = act.getAttribute("data-id");
    if(a==="newtask") doNewTask(id2);
    else if(a==="ping") doPing(id2);
    else if(a==="pause"||a==="resume") doPauseResume(id2);
    else if(a==="dm") openThread(id2);
    return;
  }
  if(!t.closest(".menu")){ closeMenus(); } else { return; }
  var card = t.closest("[data-open]");
  if(card){ openThread(card.getAttribute("data-open")); return; }
  var thr = t.closest("[data-thread]");
  if(thr){ openThread(thr.getAttribute("data-thread")); return; }
});
$$("nav.tabs a").forEach(function(a){
  a.addEventListener("click", function(e){
    e.preventDefault();
    state.thread = null;
    showView(a.getAttribute("data-v"));
  });
});
$("#backBtn").addEventListener("click", function(){ state.thread=null; $("#view-thread").classList.remove("on"); showView("chat"); });
$("#msgAllBtn").addEventListener("click", function(){ openThread("broadcast"); });
$("#bannerX").addEventListener("click", function(e){ e.stopPropagation(); LS.set("bannerDismissed", true); $("#firstBanner").classList.add("hide"); });
$("#sendBtn").addEventListener("click", sendCurrent);
$("#composer").addEventListener("keydown", function(e){
  if(e.key==="Enter" && !e.shiftKey && window.matchMedia("(pointer:fine)").matches){ e.preventDefault(); sendCurrent(); }
});
$("#composer").addEventListener("input", function(){ this.style.height="auto"; this.style.height=Math.min(96,this.scrollHeight)+"px"; });
$("#clearChats").addEventListener("click", function(){
  if(confirm("Clear all chat history on this device? This can't be undone.")){
    ["broadcast"].concat(members().map(function(m){return m.id;})).forEach(function(tid){ LS.del(histKey(tid)); });
    LS.set("unread", {}); LS.set("outbox", []);
    renderChatList(); if(state.thread) renderThread();
    toast("Chat history cleared");
  }
});
/* ts tap -> absolute */
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-ts]"); if(!el) return;
  var abs = el.getAttribute("title");
  if(el.dataset.showing==="abs"){ el.dataset.showing=""; el.textContent = el.getAttribute("data-rel")||el.textContent; }
  else { el.dataset.showing="abs"; el.setAttribute("data-rel", el.textContent); el.textContent = abs; }
});
/* ---------- first-run seed ---------- */
(function seedWelcome(){
  if(LS.get("seeded", false)) return;
  var allIdle = (SEED.members||[]).every(function(m){ return (m.status||"idle")==="idle"; });
  if(!allIdle){ LS.set("seeded", true); return; }
  LS.set("broadcast", [{ from:"producer", dir:"in", text:WELCOME, ts:SEED.updated_at }]);
  var u = LS.get("unread", {}); u.broadcast = 1; LS.set("unread", u);
  LS.set("seeded", true);
})();
/* ---------- boot ---------- */
var h0 = (location.hash||"").replace("#","");
showView(VIEWS.indexOf(h0)>=0 ? h0 : "teams");
renderHeader(); renderDashboard(); renderChatList();
fetchStatus();
setInterval(fetchStatus, POLL_MS);
setInterval(renderHeader, 10000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) fetchStatus(); });
mqttInit();
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  try{ navigator.serviceWorker.register("sw.js").catch(function(){}); }catch(e){}
}
})();
</script>

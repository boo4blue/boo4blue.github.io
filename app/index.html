<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haven FW — Free Resource Directory</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0e17; color: #e0e0e0; padding-bottom: 70px; }
header { background: #1a1f2e; padding: 16px; position: sticky; top: 0; z-index: 100; }
header h1 { font-size: 24px; color: #7c8aff; }
header p { color: #888; font-size: 14px; }
.tab { display: none; }
.tab.active { display: block; }
#search { width: calc(100% - 32px); padding: 12px; margin: 12px 16px; border: 1px solid #333; border-radius: 8px; background: #1a1f2e; color: #fff; font-size: 16px; }
#filters { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 12px; }
#sortrow { display: flex; align-items: center; gap: 8px; padding: 0 16px 12px; font-size: 14px; color: #888; }
#sort { background: #1a1f2e; color: #fff; border: 1px solid #333; border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.filter-btn { padding: 8px 16px; border: 1px solid #333; border-radius: 20px; background: #1a1f2e; color: #ccc; white-space: nowrap; cursor: pointer; font-size: 14px; }
.filter-btn.active { background: #7c8aff; color: #fff; border-color: #7c8aff; }
#map { height: 300px; margin: 0 16px; border-radius: 12px; z-index: 1; }
#list, .content { padding: 16px; }
.card { background: #1a1f2e; border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer; position: relative; }
.card h3 { color: #fff; margin-bottom: 8px; font-size: 17px; padding-right: 36px; }
.fav-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.35); border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 18px; cursor: pointer; z-index: 2; }
.card p { color: #aaa; font-size: 14px; margin-bottom: 4px; line-height: 1.4; }
.card .meta { display: flex; gap: 12px; margin-top: 8px; font-size: 13px; flex-wrap: wrap; }
.card a { color: #7c8aff; text-decoration: none; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #2a3040; color: #aaa; margin-right: 6px; margin-bottom: 4px; }
.open-badge { display: inline-block; background: #1d3a26; color: #4ade80; border: 1px solid #2d5a3d; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
#loading { text-align: center; padding: 40px; color: #888; }
nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1f2e; display: flex; z-index: 1000; border-top: 1px solid #2a3040; }
nav button { flex: 1; padding: 10px 4px; background: none; border: none; color: #888; font-size: 11px; cursor: pointer; }
nav button.active { color: #7c8aff; }
nav button .ico { font-size: 20px; display: block; margin-bottom: 2px; }
.sos { background: #e74c3c; color: #fff; border: none; padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; margin: 0 16px 12px; width: calc(100% - 32px); }
.hotline { background: #1a1f2e; border-radius: 12px; padding: 16px; margin-bottom: 12px; border-left: 4px solid #e74c3c; }
.hotline h3 { color: #fff; margin-bottom: 4px; }
.hotline a { color: #7c8aff; font-size: 20px; font-weight: bold; text-decoration: none; }
.check { display: flex; align-items: center; gap: 12px; padding: 12px; background: #1a1f2e; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
.check.done { opacity: 0.6; }
.check.done .ct { text-decoration: line-through; }
.emoji-pin { background: none; border: none; }
#sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 2000; display: none; }
#sheet-overlay.open { display: block; }
#sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 82vh; overflow-y: auto; background: #1a1f2e; border-radius: 18px 18px 0 0; padding: 20px 20px 30px; border-top: 1px solid #2a3040; }
#sheet h2 { color: #fff; margin-bottom: 8px; font-size: 20px; padding-right: 40px; }
#sheet .row { margin-bottom: 10px; font-size: 15px; color: #ccc; line-height: 1.45; }
#sheet .row a { color: #7c8aff; text-decoration: none; }
#sheet .sec { color: #7c8aff; font-weight: bold; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; margin: 14px 0 6px; }
#sheet-close { position: absolute; top: 12px; right: 12px; background: #2a3040; color: #fff; border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 18px; cursor: pointer; }
.sheet-btn { display: inline-block; background: #7c8aff; color: #fff; padding: 10px 20px; border-radius: 10px; text-decoration: none; font-weight: bold; margin: 4px 8px 4px 0; }
.guide-detail { margin-top: 10px; border-top: 1px solid #2a3040; padding-top: 6px; }
.gsec { color: #7c8aff; font-weight: bold; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; margin: 14px 0 6px; }
.gsteps { margin: 6px 0 6px 20px; font-size: 14px; color: #ccc; line-height: 1.55; }
.gsteps li { margin-bottom: 8px; }
.gdim { color: #aaa; font-size: 14px; }
.guide-detail a { color: #7c8aff; text-decoration: none; }
#wx-banner { margin: 0 16px; padding-top: 8px; }
.wx-bar { display: flex; align-items: center; gap: 8px; background: #1a1f2e; border: 1px solid #2a3040; border-radius: 10px; padding: 8px 12px; font-size: 14px; color: #ccc; }
.wx-cold { background: #3a1420; border: 1px solid #7c2d3a; border-radius: 10px; padding: 10px 12px; font-size: 14px; color: #ffd7dd; line-height: 1.45; }
.wx-cold b { color: #fff; }
.wx-cold a { color: #9db4ff; font-weight: bold; }
#learn-search { width: 100%; padding: 12px; margin: 0 0 12px; border: 1px solid #333; border-radius: 8px; background: #1a1f2e; color: #fff; font-size: 16px; }
#learn-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; }
.learn-free { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #aaa; margin-bottom: 12px; cursor: pointer; }
.learn-free input { width: 18px; height: 18px; accent-color: #7c8aff; cursor: pointer; }
.learn-note { color: #666; font-size: 12px; margin-top: 12px; line-height: 1.5; }
</style>
</head>
<body>
<header>
<h1>💜 Haven FW</h1>
<p>Fort Wayne free resources — <span id="count">loading...</span></p>
</header>

<div id="tab-map" class="tab active">
  <div id="wx-banner"></div>
  <input type="search" id="search" placeholder="Search food, shelter, showers...">
  <div id="filters"></div>
  <div id="sortrow"><label for="sort">Sort:</label>
    <select id="sort">
      <option value="def" selected>Default</option>
      <option value="az">A–Z</option>
      <option value="near">📍 Nearest me</option>
    </select>
    <span id="loc-note"></span>
  </div>
  <div id="map"></div>
  <div id="list"><div id="loading">Loading resources...</div></div>
</div>

<div id="tab-saved" class="tab">
  <div class="content" id="saved-list"></div>
</div>

<div id="tab-guide" class="tab">
  <div class="content" id="guide-list"><div id="loading">Loading guides...</div></div>
</div>

<div id="tab-jobs" class="tab">
  <div class="content" id="jobs-list"></div>
</div>

<div id="tab-events" class="tab">
  <div class="content" id="events-list"></div>
</div>

<div id="tab-plan" class="tab">
  <div class="content">
    <h2 style="color:#fff;margin-bottom:12px;">📋 My Plan</h2>
    <div id="plan-list"></div>
  </div>
</div>

<div id="tab-learn" class="tab">
  <div class="content">
    <h2 style="color:#fff;margin-bottom:4px;">🎓 Learn</h2>
    <p style="color:#888;font-size:14px;margin-bottom:12px;">GED, free courses &amp; apps, college, trades — everything to help you learn</p>
    <input type="search" id="learn-search" placeholder="Search GED, Alison, FAFSA, English…">
    <div id="learn-chips"></div>
    <label class="learn-free"><input type="checkbox" id="learn-free"> Free only</label>
    <div id="learn-list"></div>
  </div>
</div>

<div id="tab-help" class="tab">
  <div class="content">
    <button class="sos" onclick="location.href='tel:911'">🆘 SOS — Call 911</button>
    <div id="hotlines"></div>
  </div>
</div>

<nav>
  <button class="active" data-tab="map"><span class="ico">🗺️</span>Map</button>
  <button data-tab="saved"><span class="ico">💾</span>Saved</button>
  <button data-tab="guide"><span class="ico">📖</span>Guide</button>
  <button data-tab="jobs"><span class="ico">💼</span>Jobs</button>
  <button data-tab="events"><span class="ico">📅</span>Events</button>
  <button data-tab="plan"><span class="ico">📋</span>Plan</button>
  <button data-tab="learn"><span class="ico">🎓</span>Learn</button>
  <button data-tab="help"><span class="ico">🆘</span>Help</button>
</nav>

<!-- Place detail sheet -->
<div id="sheet-overlay" onclick="if(event.target===this)closeSheet()">
  <div id="sheet">
    <button id="sheet-close" onclick="closeSheet()">✕</button>
    <div id="sheet-body"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let allPlaces = [];
let curList = [];
let map, markers;
let sortMode = 'def'; // def | az | near
let userLoc = null;   // {lat, lng} when granted

// Haversine distance in miles
function distMi(aLat, aLng, bLat, bLng) {
  const R = 3958.8, rad = Math.PI / 180;
  const dLat = (bLat - aLat) * rad, dLng = (bLng - aLng) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(aLat * rad) * Math.cos(bLat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function applySort(list) {
  if (sortMode === 'az') return list.slice().sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
  if (sortMode === 'near' && userLoc) return list.slice().sort((a, b) =>
    distMi(userLoc.lat, userLoc.lng, a.lat, a.lng) - distMi(userLoc.lat, userLoc.lng, b.lat, b.lng));
  return list;
}

function activeCat() { return document.querySelector('.filter-btn.active').dataset.cat; }
function activeQ() { return document.getElementById('search').value; }

function requestNear(sel) {
  if (userLoc) { sortMode = 'near'; render(activeCat(), activeQ()); return; }
  if (!navigator.geolocation) { alert('Location is not supported on this device.'); sel.value = sortMode; return; }
  document.getElementById('loc-note').textContent = 'getting location…';
  navigator.geolocation.getCurrentPosition(
    p => {
      userLoc = { lat: p.coords.latitude, lng: p.coords.longitude };
      sortMode = 'near';
      document.getElementById('loc-note').textContent = '';
      render(activeCat(), activeQ());
    },
    () => {
      document.getElementById('loc-note').textContent = '';
      alert('Could not get your location. Showing default order.');
      sel.value = sortMode;
    },
    { timeout: 8000 }
  );
}

const DATA_URL = 'https://files.catbox.moe/k7d0uc.js';
const FILTER_CATS = {
  'food': '🍔 Food', 'meals': '🍽️ Meals', 'shelter': '🏠 Shelter',
  'health': '🏥 Health', 'mental': '🧠 Mental', 'recovery': '💪 Recovery',
  'benefits': '💰 Benefits', 'bathroom': '🚻 Bathroom', 'laundry': '👕 Laundry',
  'day': '☀️ Day', 'water': '💧 Water', 'wifi': '📶 WiFi', 'charge': '🔌 Charge',
  'bus': '🚌 Transit', 'youth': '👦 Youth', 'pets': '🐾 Pets',
  'freeclothes': '👔 Clothes', 'thrift': '🛒 Thrift',
  'cash': '💵 Cash', 'vouchers': '🎟️ Vouchers'
};
const PIN_EMOJI = {
  food: '🍔', meals: '🍽️', shelter: '🏠', health: '🏥',
  mental: '🧠', recovery: '💪', benefits: '💰',
  bathroom: '🚻', laundry: '👕', wifi: '📶', charge: '🔌',
  bus: '🚌', youth: '👦', pets: '🐾', freeclothes: '👔',
  thrift: '🛒', day: '☀️', water: '💧', cash: '💵',
  vouchers: '🎟️', bank: '🏦', babybox: '📦', bikeair: '🚲',
  freebike: '🚲', hangout: '🛋️', lgbtq: '🏳️‍🌈', narcan: '💊'
};

// Saved / Favorites (localStorage)
function favIds() {
  try { return JSON.parse(localStorage.getItem('haven_favs') || '[]'); }
  catch (e) { return []; }
}
function favKey(r) { return r.id || r.name; }
function escapeAttr(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

// Open-now badge: uses the structured r.hours dict { day: [openMin, closeMin] }.
// Days are 0=Sun..6=Sat (a few entries use 7 for Sunday); values are minutes since midnight.
// A few entries encode HH:MM as HHMM (e.g. 1500-2000 = 3pm-8pm); detected by value > 1440.
// Returns true/false when the dict covers today, null when hours are unknown (no badge).
function isOpenNow(r) {
  const h = r && r.hours;
  if (!h || typeof h !== 'object') return null;
  const d = new Date();
  const day = d.getDay();
  let v = h[day];
  if (v === undefined && day === 0) v = h[7]; // some entries use 7 for Sunday
  if (Array.isArray(v) && v.length === 0) return false; // explicit "closed today" marker
  if (!Array.isArray(v) || v.length !== 2 || typeof v[0] !== 'number' || typeof v[1] !== 'number') return null;
  let o = v[0], c = v[1];
  if (o > 1440 || c > 1440) { // HHMM-encoded entries
    const conv = x => Math.floor(x / 100) * 60 + (x % 100);
    o = conv(o); c = conv(c);
  }
  if (!(o >= 0 && c > o && c <= 1440)) return null;
  const now = d.getHours() * 60 + d.getMinutes();
  return now >= o && now < c;
}
function openBadge(r) {
  return isOpenNow(r) === true ? '<div class="open-badge">🟢 Open now</div>' : '';
}
function openStatusLine(r) {
  const s = isOpenNow(r);
  if (s === true) return ' <b style="color:#4ade80">🟢 Open now</b>';
  if (s === false) return ' <span style="color:#e74c3c">🔴 Closed now</span>';
  return '';
}
function toggleFavAttr(btn) { toggleFav(btn.dataset.fkey); }
function toggleFav(key) {
  let ids = favIds();
  ids = ids.includes(key) ? ids.filter(x => x !== key) : [...ids, key];
  try { localStorage.setItem('haven_favs', JSON.stringify(ids)); } catch (e) {}
  render(document.querySelector('.filter-btn.active').dataset.cat, document.getElementById('search').value);
  renderFavs();
}

function loadData(attempt) {
  const s = document.createElement('script');
  s.src = DATA_URL;
  s.onload = init;
  s.onerror = () => {
    s.remove();
    if (attempt < 3) setTimeout(() => loadData(attempt + 1), 2000);
    else document.getElementById('loading').textContent = 'Failed to load. Please refresh.';
  };
  document.head.appendChild(s);
}

function init() {
  if (typeof RESOURCES === 'undefined') return;
  allPlaces = RESOURCES.filter(r => r.lat && r.lng);
  document.getElementById('count').textContent = allPlaces.length + ' places';

  map = L.map('map').setView([41.079, -85.139], 12);
  L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_4h9q_1_84dc6afd4f5c6cd3901f9e35', {
    maxZoom: 19, attribution: '© OSM © CARTO'
  }).addTo(map);

  const fc = document.getElementById('filters');
  fc.innerHTML = '<button class="filter-btn active" data-cat="">All</button>' +
    Object.entries(FILTER_CATS).map(([k,v]) => `<button class="filter-btn" data-cat="${k}">${v}</button>`).join('');
  fc.addEventListener('click', e => {
    if (e.target.dataset.cat !== undefined) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      render(e.target.dataset.cat, document.getElementById('search').value);
    }
  });
  document.getElementById('search').addEventListener('input', e => {
    render(document.querySelector('.filter-btn.active').dataset.cat, e.target.value);
  });
  document.getElementById('sort').addEventListener('change', e => {
    const v = e.target.value;
    if (v === 'near') requestNear(e.target);
    else { sortMode = v; render(activeCat(), activeQ()); }
  });

  // Tab navigation
  document.querySelectorAll('nav button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      document.getElementById('tab-' + b.dataset.tab).classList.add('active');
      if (b.dataset.tab === 'saved') renderFavs();
      if (b.dataset.tab === 'learn') renderLearn();
      if (b.dataset.tab === 'map' && map) setTimeout(() => map.invalidateSize(), 100);
    });
  });

  render('', '');
  renderGuides();
  renderJobs();
  renderEvents();
  renderPlan();
  renderHotlines();
  renderLearn();

  // Learn tab controls
  document.getElementById('learn-chips').addEventListener('click', e => {
    const c = e.target.closest ? e.target.closest('[data-lcat]') : null;
    if (c) { learnCat = c.dataset.lcat; renderLearn(); }
  });
  document.getElementById('learn-search').addEventListener('input', e => {
    learnQ = e.target.value; renderLearn();
  });
  document.getElementById('learn-free').addEventListener('change', e => {
    learnFree = e.target.checked; renderLearn();
  });
}

function render(cat, q) {
  q = (q || '').toLowerCase();
  let list = allPlaces;
  if (cat) list = list.filter(r => (r.cats || []).includes(cat));
  if (q) list = list.filter(r =>
    (r.name + ' ' + (r.desc||'') + ' ' + (r.addr||'')).toLowerCase().includes(q));
  list = applySort(list);

  if (markers) map.removeLayer(markers);
  markers = L.layerGroup();
  list.slice(0, 200).forEach(r => {
    let emoji = '💜';
    for (const c of (r.cats || [])) { if (PIN_EMOJI[c]) { emoji = PIN_EMOJI[c]; break; } }
    L.marker([r.lat, r.lng], {
      icon: L.divIcon({
        html: `<div style="font-size:24px;text-align:center;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.5))">${emoji}</div>`,
        className: 'emoji-pin', iconSize: [28, 28], iconAnchor: [14, 14]
      })
    }).bindPopup(`<b>${r.name}</b><br>${r.addr||''}<br><a href="https://maps.google.com/?q=${r.lat},${r.lng}" target="_blank">Directions</a> · <a href="https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lng}&travelmode=transit" target="_blank">🚌 Transit</a>`).addTo(markers);
  });
  markers.addTo(map);

  document.getElementById('list').innerHTML = (curList = list.slice(0, 50)).map((r, idx) => {
    const fk = favKey(r), fav = favIds().includes(fk);
    const d = (sortMode === 'near' && userLoc) ? distMi(userLoc.lat, userLoc.lng, r.lat, r.lng) : null;
    return `
    <div class="card" onclick="openSheet(${idx})">
      <button class="fav-btn" data-fkey="${escapeAttr(fk)}" onclick="event.stopPropagation();toggleFavAttr(this)" aria-label="Save place">${fav ? '❤️' : '🤍'}</button>
      <h3>${r.name}</h3>
      ${openBadge(r)}
      <p>${r.addr || ''}</p>
      <p>${(r.desc || '').substring(0, 120)}...</p>
      <div class="meta">${(r.cats || []).slice(0, 3).map(c => `<span class="badge">${c}</span>`).join('')}${d !== null ? `<span class="badge" style="color:#7c8aff">📍 ${d.toFixed(1)} mi</span>` : ''}</div>
      <div class="meta">
        ${r.phone ? `<a href="tel:${r.phone}">📞 ${r.phone}</a>` : ''}
        ${r.lat ? `<a href="https://maps.google.com/?q=${r.lat},${r.lng}" target="_blank">🗺️ Directions</a>` : ''}
        ${r.lat ? `<a href="https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lng}&travelmode=transit" target="_blank">🚌 Transit</a>` : ''}
      </div>
      <div class="meta" style="color:#7c8aff">Tap for details →</div>
    </div>`;
  }).join('') || '<p style="text-align:center;color:#888">No places found.</p>';
}

function renderFavs() {
  const ids = favIds();
  const list = allPlaces.filter(r => ids.includes(favKey(r)));
  document.getElementById('saved-list').innerHTML =
    '<h2 style="color:#fff;margin-bottom:12px;">💾 Saved Places</h2>' +
    (list.map(r => {
      const fk = favKey(r);
      return `
    <div class="card" data-fkey="${escapeAttr(fk)}" onclick="openSheetByKey(this.dataset.fkey)">
      <button class="fav-btn" data-fkey="${escapeAttr(fk)}" onclick="event.stopPropagation();toggleFavAttr(this)" aria-label="Remove from saved">❤️</button>
      <h3>${r.name}</h3>
      ${openBadge(r)}
      <p>${r.addr || ''}</p>
      <p>${(r.desc || '').substring(0, 120)}...</p>
      <div class="meta">${(r.cats || []).slice(0, 3).map(c => `<span class="badge">${c}</span>`).join('')}</div>
      <div class="meta" style="color:#7c8aff">Tap for details →</div>
    </div>`;
    }).join('') || '<p style="color:#888">No saved places yet.<br>Tap the 🤍 on any place to save it here.</p>');
}

function openSheetByKey(fkey) {
  const r = allPlaces.find(x => favKey(x) === fkey);
  if (r) showSheet(r);
}

function openSheet(i) {
  const r = curList[i];
  if (r) showSheet(r);
}

function showSheet(r) {
  const telHref = r.phoneHref ? 'tel:+' + String(r.phoneHref).replace(/^\+/, '')
    : (r.phone ? 'tel:' + String(r.phone).replace(/[^0-9+]/g, '') : '');
  document.getElementById('sheet-body').innerHTML = `
    <h2>${r.name}</h2>
    ${r.addr ? `<div class="row">📍 ${r.addr}${r.zip ? ' ' + r.zip : ''}</div>` : ''}

// Guide detail view: tap a guide card to expand steps / bring list / where+directions
function toggleGuide(el, i) {
  const old = el.querySelector('.guide-detail');
  if (old) { old.remove(); return; }
  const g = GUIDES[i];
  if (!g) return;
  const steps = Array.isArray(g.steps) ? g.steps : [];
  const bring = Array.isArray(g.bring) ? g.bring : [];
  let html = '';
  if (steps.length) {
    html += '<div class="gsec">📝 Steps</div><ol class="gsteps">' + steps.map(s => {
      const t = typeof s === 'string' ? s : (s.t || s.title || s.name || '');
      const d = typeof s === 'string' ? '' : (s.d || s.desc || s.text || '');
      return `<li><b>${t}</b>${d ? `<br><span class="gdim">${d}</span>` : ''}</li>`;
    }).join('') + '</ol>';
  }
  if (bring.length) {
    html += '<div class="gsec">🎒 Bring</div><ul class="gsteps">' + bring.map(b =>
      `<li>${typeof b === 'string' ? b : (b.t || b.title || b.name || '')}</li>`).join('') + '</ul>';
  }
  if (g.where) {
    html += `<div class="gsec">📍 Where</div><p class="gdim">${g.where} <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(g.where)}" target="_blank">🗺️ Directions</a></p>`;
  }
  if (!html) html = '<p class="gdim">No details available for this guide.</p>';
  const div = document.createElement('div');
  div.className = 'guide-detail';
  div.innerHTML = html;
  el.appendChild(div);
}

let learnCat = 'all', learnQ = '', learnFree = false;

function learnCatName(c) {
  const f = LEARN_CATS.find(x => x[0] === c);
  return f ? f[1] + ' ' + f[2] : c;
}
function learnCard(i) {
  const extra = i[9] || {};
  const costCls = i[6] === 'Free' ? 'open-badge' : 'badge';
  const btns = [];
  if (i[5]) btns.push(`<a class="sheet-btn" href="${i[5]}" target="_blank" rel="noopener">Open ↗</a>`);
  if (extra.q) btns.push(`<button class="sheet-btn" onclick="learnGoMap('${extra.q}')">🔍 ${extra.label || 'See places'}</button>`);
  if (extra.learn) btns.push(`<button class="sheet-btn" onclick="learnFilter('${extra.learn}')">${extra.label || 'View'}</button>`);
  return `
  <div class="card">
    <h3>${i[2]} ${i[3]}</h3>
    <div class="meta"><span class="${costCls}">${i[6]}</span>${i[7] ? '<span class="badge">📱 App</span>' : ''}<span class="badge">${learnCatName(i[1])}</span></div>
    <p>${i[4]}</p>
    ${(i[8] || []).length ? `<div class="meta">${(i[8] || []).map(t => `<span class="badge">✓ ${t}</span>`).join('')}</div>` : ''}
    ${btns.length ? `<div class="meta">${btns.join('')}</div>` : ''}
  </div>`;
}
function renderLearn() {
  const chipsEl = document.getElementById('learn-chips');
  if (chipsEl) {
    chipsEl.innerHTML = `<button class="filter-btn${learnCat === 'all' ? ' active' : ''}" data-lcat="all">All</button>` +
      LEARN_CATS.map(c => `<button class="filter-btn${learnCat === c[0] ? ' active' : ''}" data-lcat="${c[0]}">${c[1]} ${c[2]}</button>`).join('');
  }
  const q = learnQ.trim().toLowerCase();
  const list = LEARN_ITEMS.filter(i => {
    if (learnCat !== 'all' && i[1] !== learnCat) return false;
    if (learnFree && i[6] !== 'Free') return false;
    if (q && !(i[3] + ' ' + i[4] + ' ' + (i[8] || []).join(' ')).toLowerCase().includes(q)) return false;
    return true;
  });
  let h = '';
  if ((learnCat === 'all' || learnCat === 'ged') && !q) {
    h += `<div class="card" onclick="toggleLearnSteps(this)"><h3>🗺️ How to get your GED — step by step</h3><p style="color:#7c8aff">6 steps · tap to open</p></div>`;
  }
  h += list.length
    ? list.map(learnCard).join('')
    : '<p style="text-align:center;color:#888">Nothing found. Try a different word or category.</p>';
  h += '<p class="learn-note">Programs, fees and deadlines change — check the website or call to confirm. Links need internet.</p>';
  document.getElementById('learn-list').innerHTML = h;
}
function toggleLearnSteps(el) {
  const old = el.querySelector('.guide-detail');
  if (old) { old.remove(); return; }
  const div = document.createElement('div');
  div.className = 'guide-detail';
  div.innerHTML = '<div class="gsec">📝 Steps</div><ol class="gsteps">' +
    LEARN_STEPS.map(s => `<li><b>${s[0]} ${s[1]}</b><br><span class="gdim">${s[2]}</span></li>`).join('') + '</ol>';
  el.appendChild(div);
}
function learnFilter(cat) {
  learnCat = cat; learnQ = '';
  const s = document.getElementById('learn-search');
  if (s) s.value = '';
  renderLearn();
}
function learnGoMap(q) {
  document.querySelectorAll('#filters .filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === ''));
  document.getElementById('search').value = q;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x.dataset.tab === 'map'));
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.getElementById('tab-map').classList.add('active');
  if (map) {
    setTimeout(() => map.invalidateSize(), 100);
    render('', q);
  } else {
    alert('Places are still loading — try again in a moment.');
  }
}

  const el = document.getElementById('wx-banner');
  if (!el || !wx || !wx.current) return;
  const t = Math.round(wx.current.temperature_2m);
  const f = Math.round(wx.current.apparent_temperature);
  const icon = wxIcon(wx.current.weather_code);
  if (f <= 32) {
    el.innerHTML = `<div class="wx-cold">🥶 <b>Cold alert:</b> it feels like ${f}°F out there. ` +
      `<a href="#" onclick="wxShelter();return false;">🏠 Find a warm place →</a></div>`;
  } else {
    el.innerHTML = `<div class="wx-bar">${icon} <span>Fort Wayne: <b>${t}°F</b> (feels like ${f}°F)</span></div>`;
  }
}
function wxShelter() {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.getElementById('tab-map').classList.add('active');
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x.dataset.tab === 'map'));
  const b = document.querySelector('.filter-btn[data-cat="shelter"]');
  if (b) b.click(); else alert('Places are still loading — try again in a moment.');
}
function loadWeather() {
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + WX_LAT + '&longitude=' + WX_LON +
    '&current=temperature_2m,apparent_temperature,weather_code&temperature_unit=fahrenheit&timezone=America%2FIndiana%2FIndianapolis';
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = setTimeout(() => { if (ctl) ctl.abort(); }, 8000);
  fetch(url, ctl ? { signal: ctl.signal } : {})
    .then(r => { clearTimeout(timer); if (!r.ok) throw new Error('wx'); return r.json(); })
    .then(renderWeather)
    .catch(() => { clearTimeout(timer); /* banner stays hidden on failure */ });
}

window.addEventListener('DOMContentLoaded', () => { loadData(1); loadWeather(); });
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haven FW — Free Resource Directory</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0e17; color: #e0e0e0; }
header { background: #1a1f2e; padding: 16px; position: sticky; top: 0; z-index: 100; }
header h1 { font-size: 24px; color: #7c8aff; }
header p { color: #888; font-size: 14px; }
#search { width: 100%; padding: 12px; margin: 12px 0; border: 1px solid #333; border-radius: 8px; background: #1a1f2e; color: #fff; font-size: 16px; }
#filters { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 12px; }
.filter-btn { padding: 8px 16px; border: 1px solid #333; border-radius: 20px; background: #1a1f2e; color: #ccc; white-space: nowrap; cursor: pointer; }
.filter-btn.active { background: #7c8aff; color: #fff; border-color: #7c8aff; }
#map { height: 300px; margin: 0 16px; border-radius: 12px; }
#list { padding: 16px; }
.card { background: #1a1f2e; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.card h3 { color: #fff; margin-bottom: 8px; }
.card p { color: #aaa; font-size: 14px; margin-bottom: 4px; }
.card .meta { display: flex; gap: 12px; margin-top: 8px; font-size: 13px; }
.card a { color: #7c8aff; text-decoration: none; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #2a3040; color: #aaa; margin-right: 6px; }
#loading { text-align: center; padding: 40px; color: #888; }
</style>
</head>
<body>
<header>
<h1>💜 Haven FW</h1>
<p>Fort Wayne free resources — <span id="count">loading...</span></p>
</header>
<input type="search" id="search" placeholder="Search food, shelter, showers...">
<div id="filters"></div>
<div id="map"></div>
<div id="list"><div id="loading">Loading resources...</div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let allPlaces = [];
let map, markers;

const DATA_URL = 'https://files.catbox.moe/k7d0uc.js';
const DATA_RETRIES = 3;

const FILTER_CATS = {
  'food': '🍔 Food', 'shelter': '🏠 Shelter', 'health': '🏥 Health',
  'shower': '🚿 Showers', 'laundry': '👕 Laundry', 'wifi': '📶 WiFi',
  'jobs': '💼 Jobs', 'benefits': '💰 Benefits', 'mental': '🧠 Mental Health',
  'youth': '👦 Youth', 'pets': '🐾 Pets', 'transport': '🚌 Transport'
};

function loadData(attempt) {
  const loadingEl = document.getElementById('loading');
  loadingEl.textContent = attempt > 1
    ? 'Loading resources... (retry ' + (attempt - 1) + ' of ' + (DATA_RETRIES - 1) + ')'
    : 'Loading resources...';
  const s = document.createElement('script');
  s.src = DATA_URL;
  s.onload = init;
  s.onerror = () => {
    s.remove();
    if (attempt < DATA_RETRIES) {
      setTimeout(() => loadData(attempt + 1), 2000);
    } else {
      loadingEl.innerHTML = 'Could not load resource data. <button class="filter-btn" id="retry-btn">Try again</button>';
      document.getElementById('retry-btn').addEventListener('click', () => loadData(1));
    }
  };
  document.head.appendChild(s);
}

function init() {
  if (typeof RESOURCES === 'undefined') {
    document.getElementById('loading').textContent = 'Failed to load data. Please refresh.';
    return;
  }
  allPlaces = RESOURCES.filter(r => r.lat && r.lng);
  document.getElementById('count').textContent = allPlaces.length + ' places';
  
  // Map
  map = L.map('map').setView([41.079, -85.139], 12);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  }).addTo(map);
  
  // Filters
  const fc = document.getElementById('filters');
  fc.innerHTML = '<button class="filter-btn active" data-cat="">All</button>' +
    Object.entries(FILTER_CATS).map(([k,v]) => `<button class="filter-btn" data-cat="${k}">${v}</button>`).join('');
  fc.addEventListener('click', e => {
    if (e.target.dataset.cat !== undefined) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      render(e.target.dataset.cat, document.getElementById('search').value);
    }
  });
  
  document.getElementById('search').addEventListener('input', e => {
    const cat = document.querySelector('.filter-btn.active').dataset.cat;
    render(cat, e.target.value);
  });
  
  render('', '');
}

function render(cat, q) {
  q = q.toLowerCase();
  let list = allPlaces;
  if (cat) list = list.filter(r => (r.cats || []).includes(cat));
  if (q) list = list.filter(r => 
    (r.name + ' ' + (r.desc||'') + ' ' + (r.addr||'')).toLowerCase().includes(q)
  );
  
  // Update map
  if (markers) map.removeLayer(markers);
  markers = L.layerGroup();
  list.slice(0, 200).forEach(r => {
    L.marker([r.lat, r.lng]).bindPopup(`<b>${r.name}</b><br>${r.addr||''}`).addTo(markers);
  });
  markers.addTo(map);
  
  // Update list
  const el = document.getElementById('list');
  el.innerHTML = list.slice(0, 50).map(r => `
    <div class="card">
      <h3>${r.name}</h3>
      <p>${r.addr || ''}</p>
      <p>${(r.desc || '').substring(0, 120)}...</p>
      <div class="meta">
        ${(r.cats || []).slice(0, 3).map(c => `<span class="badge">${c}</span>`).join('')}
      </div>
      <div class="meta">
        ${r.phone ? `<a href="tel:${r.phone}">📞 ${r.phone}</a>` : ''}
        ${r.lat ? `<a href="https://maps.google.com/?q=${r.lat},${r.lng}" target="_blank">🗺️ Directions</a>` : ''}
      </div>
    </div>
  `).join('') || '<p style="text-align:center;color:#888">No places found.</p>';
}

window.addEventListener('DOMContentLoaded', () => loadData(1));
</script>
</body>
</html>
